<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignment #3: Giphy API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container my-5">
      <h1 class="mb-4 text-center">Fetch a GIF</h1>

      <div class="row justify-content-center mb-3">
        <div class="col-md-6">
          <label for="search-input" class="form-label">Search for a GIF</label>
          <input type="text" id="search-input" class="form-control" placeholder="Try cats, soccer, or happy" aria-describedby="search-help" />
          <p id="search-help" class="form-text">Enter a keyword, or leave it blank for dog GIFs.</p>
        </div>
      </div>

      <div class="d-flex justify-content-center mb-4">
        <button id="fetch-gif-btn" class="btn btn-primary" type="button">
          Fetch a GIF
        </button>
      </div>

      <p id="status-message" class="text-center text-secondary" role="status" aria-live="polite"></p>
      <div id="gif-container" class="row"></div>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
